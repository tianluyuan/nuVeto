# This workflow will install Python dependencies, run tests and lint

name: status

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.toml'
      - '**/*.py'
      - '.github/workflows/*'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.toml'
      - '**/*.py'
      - '.github/workflows/*'
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '25 9 * * 2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.x"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v10.3.3
    - uses: astral-sh/ruff-action@v3
      with:
        src: "src scripts"
        version: "latest"
    - name: Install dependencies
      run: |
        uv venv --python "$(command -v python)"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        source .venv/bin/activate
        if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
        if ! uv pip install -e ".[testing]"; then
          echo "::warning::Install failed; retrying with h5py nightly wheels"
          uv pip install --prerelease=allow --no-deps --no-build \
            --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
            h5py
          uv pip install -e ".[testing]"
        fi
    - name: Run pytest
      run: pytest
    - name: Test mu.py
      run: |
        uv pip install -e .
        ./scripts/mu/mu.py ice_allm97 -o fake/path/mymudet.npz --plight pl_step_1000
        pytest -k test_pdet

  results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Final Results
    needs: [build]
    steps:
      - run: exit 1
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
